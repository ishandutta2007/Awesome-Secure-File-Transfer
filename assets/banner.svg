<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="40%" stop-color="#0b1329" />
      <stop offset="70%" stop-color="#081b2e" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <!-- Cyber Accent Gradient -->
    <linearGradient id="cyber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Shield & Node Gradients -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="shield-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes laserScan {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { opacity: 0.85; }
        100% { transform: translateY(290px); opacity: 0.15; }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes floatEffect {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes flowPackets {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .laser-scanner {
        animation: laserScan 4.5s ease-in-out infinite alternate;
      }
      .pulsing-shield {
        animation: floatEffect 4.5s ease-in-out infinite;
        transform-origin: 175px 210px;
      }
      .active-pulse {
        animation: pulseGlow 3s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 10 8;
        animation: flowPackets 5s linear infinite;
      }
      .radar-sweep {
        transform-origin: 175px 210px;
        animation: radarSweep 7s linear infinite;
      }
      .title-main {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Ubuntu, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .sub-badge {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .body-mono {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Frame -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Cyber Grid Lines -->
  <g stroke="#00f2fe" stroke-opacity="0.04" stroke-width="1">
    <path d="M0,70 L1200,70 M0,140 L1200,140 M0,210 L1200,210 M0,280 L1200,280 M0,350 L1200,350" />
    <path d="M100,0 L100,420 M200,0 L200,420 M300,0 L300,420 M400,0 L400,420 M500,0 L500,420 M600,0 L600,420 M700,0 L700,420 M800,0 L800,420 M900,0 L900,420 M1000,0 L1000,420 M1100,0 L1100,420" />
  </g>

  <!-- Flow Lines Across Board -->
  <g stroke="url(#flow-grad)" stroke-width="2" fill="none">
    <path class="flow-line" d="M175,90 C 320,50 380,120 540,105 C 700,90 850,60 1150,85" />
    <path class="flow-line" d="M175,210 C 350,210 440,240 620,225 C 800,210 950,235 1160,220" />
    <path class="flow-line" d="M175,330 C 320,360 420,310 600,325 C 780,340 920,350 1150,335" />
  </g>

  <!-- Laser Scan Bar in Shield Zone -->
  <g class="laser-scanner">
    <line x1="60" y1="70" x2="290" y2="70" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.75" />
    <rect x="60" y="66" width="230" height="8" fill="#00f2fe" opacity="0.15" filter="url(#node-glow)" />
  </g>

  <!-- Left Icon Area: Shield + Lock + Radar -->
  <g class="pulsing-shield">
    <!-- Glow disc behind shield -->
    <circle cx="175" cy="210" r="140" fill="url(#shield-glow)" />
    
    <!-- Outer radar rings -->
    <circle cx="175" cy="210" r="110" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" fill="none" />
    <circle cx="175" cy="210" r="125" stroke="#10b981" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.3" fill="none" />

    <!-- Radar line sweep -->
    <g class="radar-sweep">
      <line x1="175" y1="210" x2="275" y2="150" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.4" />
      <polygon points="175,210 275,150 260,135" fill="#00f2fe" opacity="0.08" />
    </g>

    <!-- Secure Shield Shape -->
    <path d="M175,115 L245,150 C245,225 175,285 175,285 C175,285 105,225 105,150 Z" 
          fill="#0c1626" stroke="url(#shield-grad)" stroke-width="4" filter="drop-shadow(0 0 12px rgba(0,242,254,0.4))" />

    <!-- Inner Lock Icon -->
    <!-- Shackle -->
    <path d="M155,190 L155,170 C155,158 163,150 175,150 C187,150 195,158 195,170 L195,190" 
          stroke="#38bdf8" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="145" y="190" width="60" height="48" rx="8" fill="#10b981" />
    <!-- Keyhole -->
    <circle cx="175" cy="210" r="4.5" fill="#0b1329" />
    <polygon points="173,212 177,212 179,224 171,224" fill="#0b1329" />

    <!-- Data Exchange Arrows above Lock -->
    <path d="M140,140 L160,140 M155,135 L160,140 L155,145" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M210,135 L190,135 M195,130 L190,135 L195,140" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Central & Right Content -->
  <g transform="translate(340, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="320" height="32" rx="16" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.45" />
      <circle cx="16" cy="16" r="5" fill="#10b981" class="active-pulse" />
      <text x="32" y="21" fill="#38bdf8" class="sub-badge" font-size="12">ENTERPRISE MFT &amp; CLOUD TRANSFER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="148" fill="#ffffff" class="title-main" font-size="44">Awesome Secure</text>
    <text x="0" y="198" fill="url(#cyber-accent)" class="title-main" font-size="44">File Transfer</text>

    <!-- Subtitle description -->
    <text x="0" y="238" fill="#94a3b8" class="body-mono" font-size="15">
      Curated Guide to Enterprise MFT, SFTP, FTPS, AS2/AS4,
    </text>
    <text x="0" y="260" fill="#94a3b8" class="body-mono" font-size="15">
      Cloud Gateways, and Self-Hosted Open-Source Platforms
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 292)">
      <!-- Badge 1: Enterprise MFT -->
      <g transform="translate(0, 0)">
        <rect width="140" height="32" rx="8" fill="#111c33" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
        <text x="14" y="20" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🔒 Enterprise MFT</text>
      </g>
      <!-- Badge 2: Multi-Protocol -->
      <g transform="translate(152, 0)">
        <rect width="138" height="32" rx="8" fill="#111c33" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
        <text x="14" y="20" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ SFTP · FTPS · AS2</text>
      </g>
      <!-- Badge 3: Cloud Gateways -->
      <g transform="translate(302, 0)">
        <rect width="144" height="32" rx="8" fill="#111c33" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
        <text x="14" y="20" fill="#a5b4fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">☁️ Cloud Gateways</text>
      </g>
      <!-- Badge 4: Open Source -->
      <g transform="translate(458, 0)">
        <rect width="142" height="32" rx="8" fill="#111c33" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
        <text x="14" y="20" fill="#e879f9" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🌟 100% Open Source</text>
      </g>
    </g>

    <!-- Bottom Status Line -->
    <g transform="translate(0, 360)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="18" y="10" fill="#64748b" class="body-mono" font-size="12">
        Verified 2026 Reference · 30+ SaaS Platforms &amp; 50+ Open-Source Projects
      </text>
    </g>
  </g>
</svg>
